<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Zoológico Web</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

     body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #43cea2, #185a9d);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: linear-gradient(to right, #2ecc71, #27ae60); /* Verde selva */
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 95vw;
      max-width: 1200px;
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
    }

    .formulario,
    .lista {
      flex: 1 1 320px;
      min-width: 300px;
      max-width: 500px;

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4a90e2, #145ea8);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      color: #f0f4f8;
      user-select: none;
    }

    h1, h2, h3 {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 700;
      color: #f0f4f8;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      padding: 2rem 2.5rem;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 1200px;
      display: flex;
      gap: 3rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Contenedores formulario y lista */
    .formulario,
    .lista,
    /* El contenedor dueño que no tenía clase, le asigno flex para que sea consistente */
    .container > div:first-child {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 15px;
      padding: 1.5rem 1.8rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      flex: 1 1 360px;
      min-width: 320px;
      max-width: 480px;
      display: flex;
      flex-direction: column;
    }

    /* Inputs y selects */
    input,
    select {
      font-size: 1rem;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: none;
      background-color: rgba(255, 255, 255, 0.15);
      color: #f0f4f8;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.25);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      outline-offset: 3px;
      outline-color: transparent;
      cursor: text;
    }

    input::placeholder,
    select {
      color: rgba(240, 244, 248, 0.7);
    }

    input:focus,
    select:focus {
      background-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 12px 3px rgba(74, 144, 226, 0.8);
      outline-color: #4a90e2;
      color: #072146;
      font-weight: 600;
      cursor: text;
    }

    /* Botones */
    button {
      background: linear-gradient(135deg, #ff8c00, #ffb347);
      border: none;
      color: #0f0f0f;
      font-weight: 700;
      padding: 0.75rem 1.4rem;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(255, 140, 0, 0.7);
      transition: background 0.35s ease, box-shadow 0.35s ease, transform 0.2s ease;
      font-size: 1.1rem;
      user-select: none;
    }

    button:hover {
      background: linear-gradient(135deg, #ffb347, #ff8c00);
      box-shadow: 0 8px 22px rgba(255, 179, 71, 0.85);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(255, 140, 0, 0.6);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 0.6rem;
    }

    /* Lista dueños */
    #duenio-lista {
      margin-top: 0.6rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      color: #e1e9f0;
      border: none;
      box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.2);
      cursor: pointer;
      user-select: none;
    }

    /* Lista animales */
    .lista {
      max-height: 520px;
      overflow-y: auto;
      padding-right: 1rem;
      scrollbar-width: thin;
      scrollbar-color: #ffb347 transparent;
    }

    /* Scrollbar para navegadores Webkit */
    .lista::-webkit-scrollbar {
      width: 8px;
    }
    .lista::-webkit-scrollbar-track {
      background: transparent;
    }
    .lista::-webkit-scrollbar-thumb {
      background-color: #ffb347;
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background: rgba(255, 179, 71, 0.2);
      border-left: 6px solid #ff8c00;
      margin-bottom: 1.4rem;
      padding: 1rem 1.2rem;
      border-radius: 12px;
      color: #222;
      box-shadow: 0 5px 14px rgba(255, 140, 0, 0.15);
      user-select: none;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    li:hover {
      background: rgba(255, 179, 71, 0.35);
    }

    li strong {
      color: #ff6f00;
      font-weight: 700;
    }

    /* Botones de acción en cada animal */
    .btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 0.7rem;
      margin-top: 0.75rem;
    }

    .btn-group button {
      padding: 0.45rem 0.85rem;
      font-size: 1rem;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      transition: background 0.25s ease, box-shadow 0.25s ease;
      user-select: none;
    }

    .btn-group button:first-child {
      background: #ffca28;
      color: #4a4a4a;
    }

    .btn-group button:first-child:hover {
      background: #ffb300;
      box-shadow: 0 5px 12px rgba(255, 179, 0, 0.5);
    }

    .btn-group button:last-child {
      background: #e53935;
      color: white;
    }

    .btn-group button:last-child:hover {
      background: #b71c1c;
      box-shadow: 0 5px 12px rgba(183, 28, 28, 0.7);
    }

    /* Responsividad sencilla */
    @media (max-width: 850px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
      .formulario,
      .lista,
      .container > div:first-child {
        max-width: 100%;
        flex-basis: auto;
      }
    }

    /* Estilos para la notificación flotante */
    #notificacion {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-weight: bold;
      display: none;
      z-index: 1000;
      color: white;
      font-size: 1rem;
      min-width: 220px;
      text-align: center;
    }

    #notificacion.success {
      background-color: #2ecc71;
    }

    #notificacion.error {
      background-color: #e74c3c;
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- FORMULARIO DUEÑO -->
    <div>
      <h2>👤 Agregar Dueño</h2>
      <form id="form-duenio" autocomplete="off">
        <input id="nombre-duenio" type="text" placeholder="Nombre completo" required />
        <button type="submit">➕ Agregar Dueño</button>
      </form>
      <h3>📋 Dueños Registrados</h3>
      <select id="duenio-lista" size="5" aria-label="Lista de dueños registrados"></select>
    </div>

    <!-- FORMULARIO ANIMAL -->
    <div class="formulario">
      <h2>🐶 Agregar Animal</h2>
      <form id="form-animal" autocomplete="off">
        <select id="animal-duenio" required aria-label="Seleccionar dueño del animal">
          <option value="">-- Seleccionar dueño --</option>
        </select>
        <input id="nombre-animal" type="text" placeholder="Nombre del animal" required />
        <select id="especie" required aria-label="Seleccionar especie del animal">
          <option value="">-- Seleccionar especie --</option>
          <option value="Perro">Perro</option>
          <option value="Gato">Gato</option>
          <option value="Ave">Ave</option>
          <option value="Reptil">Reptil</option>
          <option value="Otro">Otro</option>
        </select>
        <input id="edad" type="number" min="0" placeholder="Edad (años)" required />
        <input id="alimentacion" type="text" placeholder="Alimentación" required />
        <input id="lugar" type="text" placeholder="Lugar de origen" required />
        <select id="sexo" required aria-label="Seleccionar sexo del animal">
          <option value="">-- Seleccionar sexo --</option>
          <option value="Macho">Macho</option>
          <option value="Hembra">Hembra</option>
          <option value="Indefinido">Indefinido</option>
        </select>
        <input id="peso" type="number" min="0" step="0.1" placeholder="Peso (kg)" required />
        <input id="fecha-adopcion" type="date" placeholder="Fecha de adopción" required />
        <select id="estado" required aria-label="Seleccionar estado del animal">
          <option value="">-- Seleccionar estado --</option>
          <option value="Disponible">Disponible</option>
          <option value="Adoptado">Adoptado</option>
          <option value="Reservado">Reservado</option>
          <option value="No disponible">No disponible</option>
        </select>

        <input id="color" placeholder="Color" required />
        <!-- Fin nuevos campos -->

        <!--  AGREGA ESTE ID: necesario para cambiar el texto del botón en modo edición -->
        <button type="submit" id="btn-animal">💾 Guardar Animal</button>

        <input id="color" type="text" placeholder="Color" required />
        <input id="vacunas" type="text" placeholder="Vacunas (separadas por coma)" />
        <button type="submit">➕ Agregar Animal</button>
      </form>
    </div>

    <!-- LISTA ANIMALES -->
    <div class="lista">
      <h2>🦜 Animales Registrados</h2>
      <ul id="lista-animales"></ul>
    </div>
  </div>


  <!-- Contenedor para mensajes flotantes -->
  <div id="notificacion"></div>

  <script>
<scrara aste
    const API_URL = 'http://localhost:3000/api/animales';

    const formDuenio = document.getElementById('form-duenio');
    const nombreDuenioInput = document.getElementById('nombre-duenio');
    const duenioLista = document.getElementById('duenio-lista');

    const formAnimal = document.getElementById('form-animal');
    const btnAnimal = document.getElementById('btn-animal'); //  Este elemento depende del id agregado en el botón HTML.
    const animalDuenioSelect = document.getElementById('animal-duenio');
    const nombreInput = document.getElementById('nombre');
    const especieInput = document.getElementById('especie');
    const edadInput = document.getElementById('edad');
    const alimentacionInput = document.getElementById('alimentacion');
    const lugarInput = document.getElementById('lugar');
    const sexoInput = document.getElementById('sexo');
    const pesoInput = document.getElementById('peso');
    const estadoInput = document.getElementById('estado');
    const colorInput = document.getElementById('color');
    const animalesLista = document.getElementById('animales');

    let animalesData = [];
    let duenios = [];
    let editando = null;

    // Función para mostrar notificaciones flotantes
    function mostrarNotificacion(mensaje, tipo = 'success') {
      const contenedor = document.getElementById('notificacion');
      contenedor.textContent = mensaje;
      contenedor.className = ''; // Limpiar clases
      contenedor.classList.add(tipo);
      contenedor.style.display = 'block';
      // Ocultar después de 3 segundos
      setTimeout(() => {
        contenedor.style.display = 'none';
      }, 3000);
    }

    formDuenio.addEventListener('submit', e => {
      e.preventDefault();
      const nombre = nombreDuenioInput.value.trim();
      if (!nombre) {
        mostrarNotificacion('Nombre requerido', 'error'); // Reemplazado alert por notificación
        return;
      }
      duenios.push({ nombre });
      renderDuenios();
      formDuenio.reset();
      mostrarNotificacion('Dueño agregado'); // Reemplazado alert por notificación
    });

    function renderDuenios() {
      duenioLista.innerHTML = '';
      animalDuenioSelect.innerHTML = '<option value="">-- Seleccionar dueño --</option>';
      duenios.forEach(d => {
        const opt1 = document.createElement('option');
        opt1.textContent = d.nombre;
        opt1.value = d.nombre;
        duenioLista.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.textContent = d.nombre;
        opt2.value = d.nombre;
        animalDuenioSelect.appendChild(opt2);
      });
    }


    formAnimal.addEventListener('submit', async e => {
      e.preventDefault();

      const animal = {
        duenio: animalDuenioSelect.value,
        nombre: nombreInput.value.trim(),
        especie: especieInput.value.trim(),
        edad: parseInt(edadInput.value),
        alimentacion: alimentacionInput.value.trim(),
        lugar: lugarInput.value.trim(),
        sexo: sexoInput.value,
        peso: parseFloat(pesoInput.value),
        estado: estadoInput.value,
        color: colorInput.value.trim(),
      };

      // Validación  de campos obligatorios para evitar enviar datos incompletos
      if (
        !animal.duenio ||
        !animal.nombre ||
        !animal.especie ||
        isNaN(animal.edad) || animal.edad <= 0 ||
        !animal.alimentacion ||
        !animal.lugar ||
        !animal.sexo ||
        isNaN(animal.peso) || animal.peso <= 0 ||
        !animal.estado ||
        !animal.color
      ) {
        mostrarNotificacion('Por favor, complete todos los campos correctamente', 'error'); // Reemplazado alert por notificación
        return;
      }

      try {
        let res;

        if (editando !== null) {
          //  EDITANDO: usamos el id del animal seleccionado
          const id = animalesData[editando].id;

          //  PUT al backend con los cambios
          res = await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(animal)
          });

          if (!res.ok) throw new Error('Error al actualizar');

          //  Volver a modo "guardar" después de editar
          editando = null;
          btnAnimal.textContent = '💾 Guardar Animal'; // vuelve a texto original

          //  Re-cargar lista desde la base de datos para reflejar cambios reales
          await cargarAnimales();
        } else {
          // Nuevo registro
          res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(animal)
          });

          if (!res.ok) throw new Error('Error de servidor');
          const data = await res.json();

          // Añadir nuevo animal al arreglo local
          animalesData.push(data);
          renderAnimales();
        }

        //  Reiniciamos formulario
        formAnimal.reset();
        animalDuenioSelect.value = '';
        mostrarNotificacion('Animal guardado correctamente'); // Reemplazado alert por notificación

      } catch (err) {
        mostrarNotificacion(err.message, 'error'); // Reemplazado alert por notificación
      }
    });


    function renderAnimales() {
      animalesLista.innerHTML = '';
      animalesData.forEach((a, i) => {
        const li = document.createElement('li');
        li.innerHTML = `
        👤 Dueño: <strong>${a.duenio}</strong><br/>
        🐾 Nombre del Animal: <strong>${a.nombre}</strong><br/>
        🐕 Especie: (${a.especie})<br/>
        🎂 Edad: ${a.edad} años<br/>
        🍽️ Alimentación: ${a.alimentacion}<br/>
        📍 Lugar: ${a.lugar}<br/>
         ⚧ Sexo: ${a.sexo}<br/>
        ⚖️ Peso: ${a.peso} kg<br/>
        📌 Estado: ${a.estado}<br/>
        🎨 Color: ${a.color}<br/>

          <div class="btn-group">
            <button onclick="editarAnimal(${i})">✏️ Editar</button>
            <button onclick="eliminarAnimal(${i})">🗑️ Eliminar</button>
          </div>
        `;
        animalesLista.appendChild(li);
      });
    }

    async function eliminarAnimal(i) {
      if (!confirm('¿Seguro que deseas eliminar?')) return;
      const id = animalesData[i].id;
      try {
        const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Error al eliminar');
        animalesData.splice(i, 1);
        renderAnimales();
        mostrarNotificacion('Animal eliminado correctamente');
      } catch (err) {
        mostrarNotificacion(err.message, 'error');
      }
    }

    function editarAnimal(i) {
      const a = animalesData[i];
      animalDuenioSelect.value = a.duenio;
      nombreInput.value = a.nombre;
      especieInput.value = a.especie;
      edadInput.value = a.edad;
      alimentacionInput.value = a.alimentacion;
      lugarInput.value = a.lugar;
      sexoInput.value = a.sexo;
      pesoInput.value = a.peso;
      estadoInput.value = a.estado;
      colorInput.value = a.color;
      btnAnimal.textContent = '💾 Actualizado Animal';
      editando = i; // <--- Esto es clave para saber que se está editando
    }


    async function cargarAnimales() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('No se pudo cargar animales');
        animalesData = await res.json();
        renderAnimales();
      } catch (err) {
        console.error(err);
        mostrarNotificacion('Error al cargar animales', 'error');
      }
    }

    cargarAnimales();
  </script>
</body>
</html>
